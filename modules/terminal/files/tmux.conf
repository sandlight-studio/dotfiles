set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g default-terminal "tmux-256color"

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

if-shell '[ -r "${XDG_CONFIG_HOME:-$HOME/.config}/sandlight-dotfiles/tmux.local.conf" ]' 'source-file "${XDG_CONFIG_HOME:-$HOME/.config}/sandlight-dotfiles/tmux.local.conf"'

