# Neutral tmux defaults. Requires tmux 3.2 or newer (Ubuntu 24.04, Debian 12,
# and Homebrew all ship newer releases).

# —— Prefix ——
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# —— General ——
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,xterm-kitty:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g escape-time 0
set -g focus-events on
# Keep agent forwarding working in panes after an SSH reconnect.
set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_CONNECTION WAYLAND_DISPLAY"

# —— Splits and windows open in the current directory ——
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# —— Vim-style pane navigation and resizing ——
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# —— Copy mode and clipboard ——
# OSC 52 reaches the local clipboard through SSH when the terminal allows it.
# A native copy command is preferred when one is available; later matches win,
# so WSL's clip.exe takes precedence over an X11 tool installed alongside it.
setw -g mode-keys vi
set -s set-clipboard on
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command "pbcopy"'
if-shell '[ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' 'set -s copy-command "xclip -selection clipboard -in"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' 'set -s copy-command "wl-copy"'
if-shell 'command -v clip.exe >/dev/null 2>&1' 'set -s copy-command "clip.exe"'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# —— Privacy ——
# prefix C-k clears the pane and its scrollback.
bind C-k send-keys C-l \; clear-history \; display-message "Pane and scrollback cleared"

# —— Reload ——
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

if-shell '[ -r "${XDG_CONFIG_HOME:-$HOME/.config}/sandlight-dotfiles/tmux.local.conf" ]' 'source-file "${XDG_CONFIG_HOME:-$HOME/.config}/sandlight-dotfiles/tmux.local.conf"'
