name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - name: Install test dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep shellcheck
      - name: Check Bash syntax
        run: |
          while IFS= read -r script; do bash -n "$script"; done < <(rg --files -g '*.sh')
      - name: Run tests and safety checks
        run: bash scripts/check.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan complete history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  wsl2:
    name: WSL2 smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Ubuntu 24.04 on WSL2
        shell: pwsh
        run: |
          wsl --set-default-version 2
          wsl --install --distribution Ubuntu-24.04 --no-launch --web-download
          wsl --set-version Ubuntu-24.04 2
          wsl --list --verbose
      - name: Run smoke test inside WSL2
        shell: pwsh
        run: |
          wsl --distribution Ubuntu-24.04 --user root --cd "$env:GITHUB_WORKSPACE" -- bash -lc "apt-get update && apt-get install -y git && bash scripts/tests/test-wsl-smoke.sh"
